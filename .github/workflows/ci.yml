name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test marketplace validation
        run: node --test scripts/validate.test.mjs scripts/gitcode-runtime.test.mjs
      - id: workflow-source
        name: Read workflow source lock
        run: |
          node scripts/validate.mjs
          echo "commit=$(node -p 'require("./workflow-source.lock.json").commit')" >> "$GITHUB_OUTPUT"
      - name: Check out pinned workflow source
        uses: actions/checkout@v4
        with:
          repository: codeasier/open-codeasier
          ref: ${{ steps.workflow-source.outputs.commit }}
          path: .workflow-source/open-codeasier
          persist-credentials: false
      - name: Verify generated workflows
        run: |
          node .workflow-source/open-codeasier/scripts/check-workflows.mjs \
            --platform codex \
            --source .workflow-source/open-codeasier \
            --target .
      - run: node scripts/validate.mjs

  gitcode-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the exact upstream runtime in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/gitcode-bridge"
          requirement="$(node scripts/gitcode-runtime.mjs)"
          "$RUNNER_TEMP/gitcode-bridge/bin/python" -m pip install "$requirement"
      - name: Check bridge helper regressions
        run: |
          "$RUNNER_TEMP/gitcode-bridge/bin/python" -m unittest discover -s scripts -p test_gitcode_bridge.py
      - name: Verify source, actual plugin command, tools and permission guards
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/gitcode-bridge/bin:$PATH"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitcode-bridge/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke-gitcode-bridge.py" \
            --root "$GITHUB_WORKSPACE" | tee "$GITHUB_WORKSPACE/gitcode-bridge-${{ matrix.python-version }}.txt"
      - name: Preserve bridge acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitcode-bridge-${{ matrix.python-version }}
          path: gitcode-bridge-${{ matrix.python-version }}.txt
          if-no-files-found: error

  codex-plugin-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install checksum-pinned official Codex CLI 0.165.0
        run: |
          set -euo pipefail
          # Official release asset digest, not an installer or a floating latest URL:
          # https://github.com/openai/codex/releases/tag/rust-v0.165.0
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 180 \
            https://github.com/openai/codex/releases/download/rust-v0.165.0/codex-package-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/codex-package.tar.gz"
          echo "e97c4463d7f146692a955d7b0e1c8cf48f97cd4d616cd45c5dcab2e8d9743316  $RUNNER_TEMP/codex-package.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/codex-client"
          tar --extract --gzip --file "$RUNNER_TEMP/codex-package.tar.gz" --directory "$RUNNER_TEMP/codex-client"
      - name: Install exact upstream runtime into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/gitcode-client"
          requirement="$(node scripts/gitcode-runtime.mjs)"
          "$RUNNER_TEMP/gitcode-client/bin/python" -m pip install "$requirement"
      - name: Verify real Codex installation and discovery without credentials
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/gitcode-client/bin:$PATH"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitcode-client/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke-codex-plugin.py" \
            --root "$GITHUB_WORKSPACE" \
            --codex "$RUNNER_TEMP/codex-client/bin/codex" \
            --evidence "$RUNNER_TEMP/codex-plugin-acceptance.json"
      - name: Preserve real-client acceptance or blocked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-plugin-client-0.165.0
          path: ${{ runner.temp }}/codex-plugin-acceptance.json
          if-no-files-found: error
